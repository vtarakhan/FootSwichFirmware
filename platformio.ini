[env:atmega16]
platform = atmelavr
board = atmega16
board_build.f_cpu = 4000000L
framework = 

; Конфігурація пінів залишається тут, ми передамо її в lcd.h
build_flags =
    -D LCD_PORT=0x15       ; PORTC (0x15 для ATmega16)
    -D LCD_DATA0_PIN=4     ; PC4 -> D4 дисплея
    -D LCD_DATA1_PIN=5     ; PC5 -> D5 дисплея
    -D LCD_DATA2_PIN=6     ; PC6 -> D6 дисплея
    -D LCD_DATA3_PIN=7     ; PC7 -> D7 дисплея
    -D LCD_RS_PIN=0        ; PC0 -> RS дисплея
    -D LCD_RW_PIN=1        ; PC1 -> RW дисплея
    -D LCD_E_PIN=2         ; PC2 -> E дисплея
upload_protocol = usbasp